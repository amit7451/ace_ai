name: CI - Quality Gate & Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality, Tests & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ion-ai/database db:generate

      - name: Build Workspaces
        run: pnpm run build

      - name: Lint Check
        run: pnpm run lint

      - name: Type Check
        run: pnpm run typecheck

      - name: Run Test Suite
        run: pnpm run test

  docker-build-check:
    name: Docker Images Build & Security Scan
    needs: quality-gate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            image: ion-ai-api
          - service: dashboard
            dockerfile: apps/dashboard/Dockerfile
            image: ion-ai-dashboard
          - service: worker
            dockerfile: apps/worker/Dockerfile
            image: ion-ai-worker
          - service: nginx
            dockerfile: infrastructure/nginx/Dockerfile
            image: ion-ai-nginx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run & local cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}:test
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
